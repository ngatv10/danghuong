<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nhúng Google Font Noto Serif -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Nhúng Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['"Noto Serif"', 'serif'] }
                }
            }
        }
    </script>
    <!-- Liên kết file CSS hiệu ứng riêng -->
    <style>
	  /* Nhập font chữ chân phương, trang nghiêm hỗ trợ đầy đủ tiếng Việt */
		@import url('https://googleapis.com');

		/* Cấu hình chung */
		body {
		  font-family: 'Noto Serif', Georgia, serif;
		  -webkit-font-smoothing: antialiased;
		  -moz-osx-font-smoothing: grayscale;
		}

		/* 1. Hiệu ứng tượng Phật lơ lửng nhẹ nhàng và tỏa hào quang ấm */
		#buddhaStatue {
		  animation: buddhaFloat 5.5s ease-in-out infinite;
		  filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.92))
				  drop-shadow(0 0 18px rgba(255, 215, 0, 0.25));
		}

		@keyframes buddhaFloat {
		  0%, 100% {
			transform: translateY(0px);
		  }
		  50% {
			transform: translateY(-6px);
		  }
		}

		/* 2. Ngọn lửa đèn thờ bập bùng tự nhiên */
		#flameLeft,
		#flameRight {
		  transform-origin: bottom center;
		  animation: candleFlicker 1.8s ease-in-out infinite alternate;
		}

		#flameRight {
		  animation-delay: 0.45s;
		}

		@keyframes candleFlicker {
		  0% {
			transform: scale(0.95, 1) rotate(-2deg);
			opacity: 0.88;
		  }
		  50% {
			transform: scale(1.06, 1.14) rotate(1.5deg);
			opacity: 1;
		  }
		  100% {
			transform: scale(0.98, 1.05) rotate(-1deg);
			opacity: 0.92;
		  }
		}

		/* 3. Vệt sáng lướt qua các nút hành lễ khi di chuột */
		#btnIncense::after,
		#btnLotus::after,
		#btnBell::after {
		  content: '';
		  position: absolute;
		  top: 0;
		  left: -100%;
		  width: 60%;
		  height: 100%;
		  background: linear-gradient(
			120deg,
			transparent,
			rgba(255, 224, 102, 0.25),
			transparent
		  );
		  transition: left 0.6s ease;
		}

		#btnIncense:hover::after,
		#btnLotus:hover::after,
		#btnBell:hover::after {
		  left: 130%;
		}

		/* 4. Tùy chỉnh ô nhập lời nguyện */
		#prayerInput {
		  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.75);
		}

		#prayerInput::placeholder {
		  transition: opacity 0.3s ease;
		}

		#prayerInput:focus::placeholder {
		  opacity: 0.4;
		}

		/* 5. Tinh chỉnh độ mượt cho khói hương và bụi vàng */
		#smokeContainer div,
		#particles div {
		  will-change: transform, opacity;
		}

		/* Chế độ Tượng Bạch Ngọc Lưu Ly */
		#buddhaStatue.jade-mode {
		  filter: hue-rotate(125deg) saturate(0.45) brightness(1.25)
				  drop-shadow(0 12px 28px rgba(0, 0, 0, 0.9))
				  drop-shadow(0 0 22px rgba(180, 255, 240, 0.45));
		  transition: filter 0.8s ease;
		}

		#buddhaStatue {
		  transition: filter 0.8s ease;
		}

		/* Chế độ Tĩnh tâm ẩn bảng điều khiển */
		footer.zen-hidden {
		  opacity: 0;
		  transform: translateY(120%);
		  pointer-events: none;
		}

		footer {
		  transition: opacity 0.5s ease, transform 0.5s ease;
		}

    /* Hiệu ứng vệt sáng lướt cho nút Gõ Mõ */
    #btnWoodenFish::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 224, 102, 0.25),
        transparent
      );
      transition: left 0.6s ease;
    }

    #btnWoodenFish:hover::after {
      left: 130%;
    }

    /* Hiệu ứng nảy nhẹ khi số biến niệm Phật tăng lên */
    .count-bump {
      animation: bumpScale 0.25s ease-out;
    }

    @keyframes bumpScale {
      0% { transform: scale(1); }
      50% { transform: scale(1.35); color: #ffffff; }
      100% { transform: scale(1); }
    }

    /* Tùy chỉnh thanh cuộn cho Sổ Vàng Lời Nguyện */
    #prayerList::-webkit-scrollbar {
      width: 5px;
    }

    #prayerList::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }

    #prayerList::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.5);
      border-radius: 10px;
    }

    #prayerList::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 215, 0, 0.8);
    }

	</style>

</head>

  <footer class="z-20 bg-[#1a0903]/85 border border-[#d4af37]/40 rounded-2xl p-3.5 md:p-5 mb-5 w-[92%] max-w-xl shadow-[0_10px_40px_rgba(0,0,0,0.9)] backdrop-blur-md">

    <!-- Hàng nút hành lễ -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3.5">
      <button id="btnIncense" type="button" class="group relative overflow-hidden bg-gradient-to-b from-[#2e1507] to-[#1a0a02] hover:from-[#47220c] hover:to-[#291104] border border-[#d4af37]/60 hover:border-[#ffd700] text-[#fceabb] font-medium text-xs md:text-sm py-2.5 px-2 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-1.5">
        <span class="text-base group-hover:scale-110 transition-transform">🔥</span>
        <span>Thắp Hương</span>
      </button>

      <button id="btnLotus" type="button" class="group relative overflow-hidden bg-gradient-to-b from-[#2e1507] to-[#1a0a02] hover:from-[#47220c] hover:to-[#291104] border border-[#d4af37]/60 hover:border-[#ffd700] text-[#fceabb] font-medium text-xs md:text-sm py-2.5 px-2 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-1.5">
        <span class="text-base group-hover:scale-110 transition-transform">🪷</span>
        <span>Dâng Hoa</span>
      </button>

      <button id="btnBell" type="button" class="group relative overflow-hidden bg-gradient-to-b from-[#2e1507] to-[#1a0a02] hover:from-[#47220c] hover:to-[#291104] border border-[#d4af37]/60 hover:border-[#ffd700] text-[#fceabb] font-medium text-xs md:text-sm py-2.5 px-2 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-1.5">
        <span class="text-base group-hover:rotate-12 transition-transform">🔔</span>
        <span>Thỉnh Chuông</span>
      </button>

      <button id="btnWoodenFish" type="button" class="group relative overflow-hidden bg-gradient-to-b from-[#2e1507] to-[#1a0a02] hover:from-[#47220c] hover:to-[#291104] border border-[#d4af37]/60 hover:border-[#ffd700] text-[#fceabb] font-medium text-xs md:text-sm py-2.5 px-2 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-1.5">
        <span class="text-base group-hover:scale-110 transition-transform">🪵</span>
        <span>Gõ Mõ</span>
      </button>
    </div>


    <!-- Form gửi lời cầu nguyện -->
    <form id="prayerForm" class="flex gap-2">
      <input type="text" id="prayerInput" placeholder="Nhập lời cầu nguyện bình an, sức khỏe..." maxlength="120" required
        class="flex-grow px-4 py-2.5 rounded-xl border border-[#b8860b]/50 bg-black/60 text-[#fff8dc] placeholder-[#a88b68]/70 placeholder:italic text-xs md:text-sm focus:outline-none focus:border-[#ffd700] focus:ring-1 focus:ring-[#ffd700]/40 transition">
      <button type="submit"
        class="bg-gradient-to-b from-[#e6c252] via-[#c5961d] to-[#8f6608] hover:from-[#ffe07d] hover:to-[#b08010] text-[#1f0d02] font-bold text-xs md:text-sm px-4 md:px-5 py-2.5 rounded-xl shadow-[0_0_15px_rgba(212,175,55,0.3)] transition transform active:scale-95 whitespace-nowrap flex items-center gap-1.5">
        <span>🙏</span>
        <span>Gửi Nguyện</span>
      </button>
    </form>
  </footer>

  <!-- Hộp thoại Sổ Vàng Lưu Lời Nguyện -->
  <div id="prayerModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-gradient-to-b from-[#2b1408] to-[#140702] border border-[#d4af37]/60 rounded-2xl w-full max-w-md p-5 shadow-[0_0_40px_rgba(255,215,0,0.25)] flex flex-col max-h-[75vh]">
      <div class="flex items-center justify-between border-b border-[#d4af37]/30 pb-3 mb-3">
        <h2 class="text-base md:text-lg font-bold text-[#ffd700] tracking-wider flex items-center gap-2">
          <span>📜</span>
          <span>Sổ Vàng Lời Cầu Nguyện</span>
        </h2>
        <button id="btnCloseModal" type="button" class="text-[#e0c097] hover:text-white text-lg px-2">✕</button>
      </div>

      <!-- Danh sách lời nguyện -->
      <div id="prayerList" class="flex-grow overflow-y-auto space-y-2.5 pr-1 text-xs md:text-sm">
        <!-- Nội dung sẽ được JS tự động thêm vào đây -->
      </div>

      <div class="border-t border-[#d4af37]/30 pt-3 mt-3 flex justify-between items-center text-xs">
        <span class="text-[#a88b68] italic">Lưu giữ tâm nguyện thành kính</span>
        <button id="btnClearPrayers" type="button" class="text-red-400 hover:text-red-300 underline">
          Xóa tất cả
        </button>
      </div>
    </div>
  </div>

<!-- Liên kết file JavaScript -->
<script>
	document.addEventListener('DOMContentLoaded', () => {
  // Lấy các phần tử DOM từ thẻ body
  const particlesContainer = document.getElementById('particles');
  const toast = document.getElementById('toast');
  const incenseSticks = document.getElementById('incenseSticks');
  const smokeContainer = document.getElementById('smokeContainer');
  const lotusLeft = document.getElementById('lotusLeft');
  const lotusRight = document.getElementById('lotusRight');
  const buddhaStatue = document.getElementById('buddhaStatue');
  const flameLeft = document.getElementById('flameLeft');
  const flameRight = document.getElementById('flameRight');

  const btnIncense = document.getElementById('btnIncense');
  const btnLotus = document.getElementById('btnLotus');
  const btnBell = document.getElementById('btnBell');
  const prayerForm = document.getElementById('prayerForm');
  const prayerInput = document.getElementById('prayerInput');

  let smokeInterval = null;
  let toastTimeout = null;
  let isIncenseLit = false;
  let isLotusOffered = false;

  // 1. Hàm hiển thị thông báo nổi (Toast)
  function showToast(message) {
    clearTimeout(toastTimeout);
    toast.textContent = message;
    toast.classList.remove('opacity-0', '-translate-y-2');
    toast.classList.add('opacity-100', 'translate-y-0');

    toastTimeout = setTimeout(() => {
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', '-translate-y-2');
    }, 3500);
  }

  // 2. Tạo bụi ánh sáng vàng bay lơ lửng trên nền
  function initGoldenParticles() {
    for (let i = 0; i < 28; i++) {
      const dot = document.createElement('div');
      const size = Math.random() * 3 + 1.5;
      dot.className = 'absolute rounded-full bg-[#ffd700] pointer-events-none';
      dot.style.width = `${size}px`;
      dot.style.height = `${size}px`;
      dot.style.left = `${Math.random() * 100}%`;
      dot.style.top = `${Math.random() * 100}%`;
      dot.style.boxShadow = '0 0 6px #ffd700';
      particlesContainer.appendChild(dot);

      const duration = Math.random() * 6000 + 5000;
      dot.animate(
        [
          { transform: 'translateY(0px) scale(0.8)', opacity: 0 },
          { transform: `translateY(-${Math.random() * 60 + 40}px) scale(1.2)`, opacity: 0.7, offset: 0.5 },
          { transform: `translateY(-${Math.random() * 120 + 80}px) scale(0.6)`, opacity: 0 }
        ],
        {
          duration: duration,
          iterations: Infinity,
          delay: Math.random() * 5000,
          easing: 'ease-in-out'
        }
      );
    }
  }

  // 3. Chuyển động bập bùng cho 2 ngọn đèn thờ & tượng Phật nhẹ nhàng
  function initAmbientMotion() {
    [flameLeft, flameRight].forEach((flame, idx) => {
      if (!flame) return;
      flame.animate(
        [
          { transform: 'scale(1) rotate(-2deg)', opacity: 0.85 },
          { transform: 'scale(1.12, 1.18) rotate(2deg)', opacity: 1 },
          { transform: 'scale(0.96, 1.05) rotate(-1deg)', opacity: 0.9 }
        ],
        {
          duration: 1400 + idx * 300,
          iterations: Infinity,
          direction: 'alternate',
          easing: 'ease-in-out'
        }
      );
    });

    if (buddhaStatue) {
      buddhaStatue.animate(
        [
          { transform: 'translateY(0px)' },
          { transform: 'translateY(-6px)' },
          { transform: 'translateY(0px)' }
        ],
        {
          duration: 5000,
          iterations: Infinity,
          easing: 'ease-in-out'
        }
      );
    }
  }

  // 4. Hiệu ứng khói hương bay lên
  function spawnSmoke() {
    const smoke = document.createElement('div');
    smoke.className = 'absolute bottom-0 w-3 h-3 rounded-full pointer-events-none';
    smoke.style.background = 'radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 70%)';
    smoke.style.left = `${35 + Math.random() * 30}%`;
    smokeContainer.appendChild(smoke);

    const driftX = (Math.random() - 0.5) * 35;
    const anim = smoke.animate(
      [
        { transform: 'translate(0, 0) scale(0.7)', opacity: 0.65 },
        { transform: `translate(${driftX * 0.5}px, -45px) scale(1.6)`, opacity: 0.35, offset: 0.5 },
        { transform: `translate(${driftX}px, -95px) scale(2.6)`, opacity: 0 }
      ],
      {
        duration: 3800,
        easing: 'ease-out'
      }
    );

    anim.onfinish = () => smoke.remove();
  }

  // 5. Sự kiện: Thắp Hương
  btnIncense.addEventListener('click', () => {
    incenseSticks.classList.remove('opacity-0', 'translate-y-4');
    incenseSticks.classList.add('opacity-100', 'translate-y-0');

    if (!isIncenseLit) {
      isIncenseLit = true;
      showToast('🙏 Đã dâng ba nén tâm hương thanh tịnh.');
      spawnSmoke();
      smokeInterval = setInterval(spawnSmoke, 550);
    } else {
      showToast('🔥 Hương trầm đang tỏa ngát không gian.');
    }
  });

  // 6. Sự kiện: Dâng Hoa Sen
  btnLotus.addEventListener('click', () => {
    lotusLeft.classList.remove('opacity-0', 'scale-50');
    lotusRight.classList.remove('opacity-0', 'scale-50');
    lotusLeft.classList.add('opacity-100', 'scale-100');
    lotusRight.classList.add('opacity-100', 'scale-100');

    if (!isLotusOffered) {
      isLotusOffered = true;
      showToast('🪷 Đã dâng đôi liên hoa thanh khiết cúng dường.');
    } else {
      showToast('🪷 Đôi hoa sen đã nở rộ trang nghiêm trên bàn thờ.');
    }
  });

  // 7. Âm thanh tiếng chuông chùa ngân vang (Web Audio API)
  function playTempleBellSound() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;

    // Các tần số hòa âm tạo tiếng chuông đồng trầm ấm
    const harmonics = [
      { freq: 220, gain: 0.45, decay: 5.5 },   // Âm nền trầm
      { freq: 440, gain: 0.25, decay: 4.0 },   // Bậc 8
      { freq: 659.25, gain: 0.15, decay: 3.0 }, // Quãng 5
      { freq: 880, gain: 0.1, decay: 2.2 }     // Âm vang cao
    ];

    harmonics.forEach((h) => {
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(h.freq, now);

      gainNode.gain.setValueAtTime(0.001, now);
      gainNode.gain.exponentialRampToValueAtTime(h.gain, now + 0.03);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, now + h.decay);

      osc.connect(gainNode);
      gainNode.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + h.decay);
    });
  }

  // Sự kiện: Thỉnh Chuông
  btnBell.addEventListener('click', () => {
    playTempleBellSound();
    showToast('🔔 Tiếng chuông ngân vang, phiền não nhẹ tan...');

    // Hiệu ứng gợn sóng hào quang khi thỉnh chuông
    const ripple = document.createElement('div');
    ripple.className = 'fixed top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-40 rounded-full border-2 border-[#ffd700]/70 pointer-events-none z-10';
    document.body.appendChild(ripple);

    const anim = ripple.animate(
      [
        { transform: 'translate(-50%, -50%) scale(0.8)', opacity: 0.9 },
        { transform: 'translate(-50%, -50%) scale(3.5)', opacity: 0 }
      ],
      { duration: 2200, easing: 'ease-out' }
    );
    anim.onfinish = () => ripple.remove();
  });

  // 8. Sự kiện: Gửi Lời Nguyện (bay lên trời như đèn trời)
  prayerForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = prayerInput.value.trim();
    if (!text) return;

    // 1. Lưu ngay vào lịch sử trước khi xóa ô nhập
    savePrayerToHistory(text);

    showToast('✨ Lời nguyện của bạn đã được gửi lên với lòng thành kính.');
    prayerInput.value = '';

    // Tạo thẻ lời nguyện bay nhẹ lên trên
    const wishEl = document.createElement('div');
    wishEl.textContent = `🙏 "${text}"`;
    wishEl.className = 'fixed bottom-32 left-1/2 -translate-x-1/2 z-30 px-4 py-1.5 rounded-full bg-[#2e1507]/90 border border-[#ffd700]/50 text-[#ffe885] text-xs md:text-sm italic shadow-[0_0_15px_rgba(255,215,0,0.4)] whitespace-nowrap pointer-events-none';
    document.body.appendChild(wishEl);

    const anim = wishEl.animate(
      [
        { transform: 'translate(-50%, 0px) scale(0.95)', opacity: 0 },
        { transform: 'translate(-50%, -30px) scale(1)', opacity: 1, offset: 0.15 },
        { transform: 'translate(-50%, -260px) scale(0.9)', opacity: 0 }
      ],
      {
        duration: 5500,
        easing: 'ease-out'
      }
    );

    anim.onfinish = () => wishEl.remove();
  });

    // --- PHẦN CẢI TIẾN 1: THANH CÔNG CỤ TIỆN ÍCH ---
  const btnAmbientAudio = document.getElementById('btnAmbientAudio');
  const btnToggleJade = document.getElementById('btnToggleJade');
  const btnZenMode = document.getElementById('btnZenMode');
  const footerPanel = document.querySelector('footer');

  let ambientCtx = null;
  let isAmbientPlaying = false;
  let isJadeMode = false;
  let isZenMode = false;

    // 1. Tạo âm thanh nền thiền định trầm ấm (Solfeggio 174Hz, 432Hz & 528Hz)
  function toggleAmbientSound() {
    if (!isAmbientPlaying) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      ambientCtx = new AudioCtx();

      const freqs = new Array(174, 432, 528);
      freqs.forEach((f, i) => {
        const osc = ambientCtx.createOscillator();
        const gain = ambientCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, ambientCtx.currentTime);
        gain.gain.setValueAtTime(i === 0 ? 0.04 : 0.015, ambientCtx.currentTime);

        osc.connect(gain);
        gain.connect(ambientCtx.destination);
        osc.start();
      });

      isAmbientPlaying = true;
      btnAmbientAudio.textContent = '🔊';
      showToast('🎶 Đã bật âm thanh thiền định tĩnh tâm.');
    } else {
      if (ambientCtx) {
        ambientCtx.close();
        ambientCtx = null;
      }
      isAmbientPlaying = false;
      btnAmbientAudio.textContent = '🔇';
      showToast('🔇 Đã tắt âm thanh nền.');
    }
  }

  btnAmbientAudio.addEventListener('click', toggleAmbientSound);

  // 2. Chuyển đổi Tượng Vàng Ròng / Tượng Bạch Ngọc
  btnToggleJade.addEventListener('click', () => {
    isJadeMode = !isJadeMode;
    buddhaStatue.classList.toggle('jade-mode', isJadeMode);
    showToast(isJadeMode ? '💎 Đã chuyển sang tôn tượng Bạch Ngọc thanh khiết.' : '✨ Đã chuyển về tôn tượng Vàng Ròng trang nghiêm.');
  });

  // 3. Chế độ Tĩnh tâm (Ẩn/Hiện thanh điều khiển dưới)
  btnZenMode.addEventListener('click', () => {
    isZenMode = !isZenMode;
    footerPanel.classList.toggle('zen-hidden', isZenMode);
    btnZenMode.textContent = isZenMode ? '🙈' : '👁️';
    showToast(isZenMode ? '🧘 Đã bật chế độ Tĩnh tâm chiêm bái.' : '🙏 Đã hiện lại bảng điều khiển hành lễ.');
  });

    // --- PHẦN CẢI TIẾN 2: GÕ MÕ TỤNG KINH & BỘ ĐẾM NIỆM PHẬT ---
    const btnWoodenFish = document.getElementById('btnWoodenFish');
    const chantCountEl = document.getElementById('chantCount');
    const btnResetCount = document.getElementById('btnResetCount');

    // Lấy số biến đã lưu từ trước trong trình duyệt
    let chantCount = parseInt(localStorage.getItem('buddha_chant_count') || '0', 10);
    chantCountEl.textContent = chantCount;

    // Hàm tăng số biến niệm Phật & tạo hiệu ứng chữ bay
    function incrementChant() {
      chantCount += 1;
      chantCountEl.textContent = chantCount;
      localStorage.setItem('buddha_chant_count', chantCount.toString());

      // Hiệu ứng nảy số
      chantCountEl.classList.remove('count-bump');
      void chantCountEl.offsetWidth;
      chantCountEl.classList.add('count-bump');

      // Tạo dòng chữ "Nam Mô A Di Đà Phật" bay nhẹ lên từ nút Gõ Mõ
      const floatingText = document.createElement('div');
      floatingText.textContent = 'Nam Mô A Di Đà Phật 🙏';
      floatingText.className = 'fixed bottom-40 left-1/2 -translate-x-1/2 z-30 text-[#ffd700] text-xs md:text-sm font-semibold tracking-wider drop-shadow-[0_0_8px_rgba(255,215,0,0.8)] pointer-events-none whitespace-nowrap';
      document.body.appendChild(floatingText);

      const randomX = (Math.random() - 0.5) * 60;
      const anim = floatingText.animate(
        new Array(
          { transform: 'translate(-50%, 0px) scale(0.9)', opacity: 0.95 },
          { transform: `translate(calc(-50% + ${randomX}px), -90px) scale(1.05)`, opacity: 0 }
        ),
        { duration: 1600, easing: 'ease-out' }
      );
      anim.onfinish = () => floatingText.remove();
    }

    // Hàm tạo âm thanh tiếng Mõ gỗ trầm ấm (Web Audio API)
    function playWoodenFishSound() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();

      // Tần số đặc trưng của tiếng mõ gỗ rỗng ruột
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(145, now + 0.08);

      gainNode.gain.setValueAtTime(0.01, now);
      gainNode.gain.linearRampToValueAtTime(0.55, now + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc.connect(gainNode);
      gainNode.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.24);
    }

    // Sự kiện bấm nút Gõ Mõ
    btnWoodenFish.addEventListener('click', () => {
      playWoodenFishSound();
      incrementChant();
    });

    // Sự kiện đặt lại bộ đếm về 0
    btnResetCount.addEventListener('click', () => {
      chantCount = 0;
      chantCountEl.textContent = '0';
      localStorage.setItem('buddha_chant_count', '0');
      showToast('📿 Đã đặt lại bộ đếm niệm Phật về 0.');
    });

    // --- PHẦN CẢI TIẾN 3: SỔ VÀNG LƯU LỜI CẦU NGUYỆN ---
    const btnPrayerBook = document.getElementById('btnPrayerBook');
    const prayerModal = document.getElementById('prayerModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const prayerList = document.getElementById('prayerList');
    const btnClearPrayers = document.getElementById('btnClearPrayers');

    // Lấy danh sách lời nguyện đã lưu trong trình duyệt
    function getSavedPrayers() {
      try {
        const raw = localStorage.getItem('buddha_saved_prayers');
        return raw ? JSON.parse(raw) : new Array();
      } catch (e) {
        return new Array();
      }
    }

    // Lưu thêm một lời nguyện mới
    function savePrayerToHistory(text) {
      const list = getSavedPrayers();
      const now = new Date();
      const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) +
                      ' - ' + now.toLocaleDateString('vi-VN');
      list.unshift({ text: text, time: timeStr });
      localStorage.setItem('buddha_saved_prayers', JSON.stringify(list));
    }

    // Hiển thị danh sách lên hộp thoại
    function renderPrayerList() {
      const list = getSavedPrayers();
      prayerList.innerHTML = '';

      if (list.length === 0) {
        prayerList.innerHTML = '<p class="text-center text-[#a88b68] italic py-6">Chưa có lời cầu nguyện nào được lưu giữ.</p>';
        return;
      }

      list.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'p-3 rounded-xl bg-black/40 border border-[#d4af37]/30 flex flex-col gap-1';

        const content = document.createElement('p');
        content.className = 'text-[#fceabb] leading-relaxed';
        content.textContent = `“${item.text}”`;

        const time = document.createElement('span');
        time.className = 'text-[11px] text-[#a88b68] text-right';
        time.textContent = item.time;

        card.appendChild(content);
        card.appendChild(time);
        prayerList.appendChild(card);
      });
    }

    // Mở hộp thoại Sổ Nguyện
    btnPrayerBook.addEventListener('click', () => {
      renderPrayerList();
      prayerModal.classList.remove('hidden');
      prayerModal.classList.add('flex');
    });

    // Đóng hộp thoại
    btnCloseModal.addEventListener('click', () => {
      prayerModal.classList.add('hidden');
      prayerModal.classList.remove('flex');
    });

    // Đóng khi bấm ra vùng tối bên ngoài
    prayerModal.addEventListener('click', (e) => {
      if (e.target === prayerModal) {
        prayerModal.classList.add('hidden');
        prayerModal.classList.remove('flex');
      }
    });

    // Xóa toàn bộ lịch sử lời nguyện
    btnClearPrayers.addEventListener('click', () => {
      localStorage.removeItem('buddha_saved_prayers');
      renderPrayerList();
      showToast('🗑️ Đã xóa lịch sử lời cầu nguyện.');
    });

    // Tự động lưu lời nguyện mỗi khi người dùng bấm nút Gửi Nguyện
    prayerForm.addEventListener('submit', () => {
      const val = prayerInput.value.trim();
      if (val) {
        savePrayerToHistory(val);
      }
    });


  // Khởi chạy hiệu ứng nền
  initGoldenParticles();
  initAmbientMotion();
});
	</script>
</body>
</html>
